[project]
name = "clustersamp"
version = "0.1.0"
description = "Sampling trees from a frame of noisy GPS pins: the pin-count estimator."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Erich Trieschman" }]
dependencies = [
    "numpy>=2",
    "polars>=1.30",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel>=6",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clustersamp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
